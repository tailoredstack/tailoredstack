name: '🐢 Node'

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6390:6379
    env:
      REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Checkout 🛬
        uses: actions/checkout@v4
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4
      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install 📥
        run: pnpm install --frozen-lockfile
      - name: Lint 💅
        run: pnpm lint
      - name: Typecheck 🔎
        run: pnpm typecheck
      - name: Build 📦
        run: pnpm build
      - name: Test ✅
        run: pnpm test
