name: "🐢 Node"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛬
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Setup Node ⚙️
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install 📥
        run: pnpm install --frozen-lockfile
      - name: Lint 💅
        run: pnpm lint
      - name: Typecheck 🔎
        run: pnpm typecheck
      - name: Build 📦
        run: pnpm build
      - name: Test ✅
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛬
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Setup Node ⚙️
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install 📥
        run: pnpm install --frozen-lockfile
      - name: Build 📦
        run: pnpm --filter @tailoredstack/cache build
      - name: E2E against real stores 🧪
        run: pnpm --filter @tailoredstack/cache test:e2e
