name: "🐢 Node"

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛬
        uses: actions/checkout@v7
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v5
      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install 📥
        run: pnpm install --frozen-lockfile
      - name: Lint 💅
        run: pnpm lint
      - name: Typecheck 🔎
        run: pnpm typecheck
      - name: Build 📦
        run: pnpm build
      - name: Test ✅
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛬
        uses: actions/checkout@v7
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v5
      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install 📥
        run: pnpm install --frozen-lockfile
      - name: Build 📦
        run: pnpm --filter @tailoredstack/cache build
      - name: E2E against real stores 🧪
        run: pnpm --filter @tailoredstack/cache test:e2e
