name: "🚀 Release"

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # Release PRs opened with GITHUB_TOKEN do not trigger other workflows (CI, commitlint).
      # A GitHub App token does. It is used when the app is configured and installed.
      # continue-on-error keeps the release running with GITHUB_TOKEN if the app is not
      # installed on this repository, so a missing install never breaks releases.
      - name: Create release app token 🔑
        id: app-token
        if: ${{ env.RELEASE_APP_CLIENT_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Warn when release app token failed
        if: ${{ env.RELEASE_APP_CLIENT_ID != '' && steps.app-token.outcome == 'failure' }}
        run: echo "::warning title=Release app token failed::Falling back to GITHUB_TOKEN; release PRs will not trigger CI."
      - name: Release Please 🏷️
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛬
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node ⚙️
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@tailoredstack"
      - name: Install 📥
        run: pnpm install --frozen-lockfile
      - name: Build 📦
        run: pnpm build
      - name: Test ✅
        run: pnpm --filter @tailoredstack/cache test
      - name: E2E against real stores 🧪
        run: pnpm --filter @tailoredstack/cache test:e2e
      - name: Publish to GitHub Packages 🚀
        working-directory: packages/cache
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks --access public
